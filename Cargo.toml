[package]
name = "au"
version = "0.2.0"
edition = "2024"
description = "Search for gold (secrets and PII) in text files"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
regex = "1.13.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
